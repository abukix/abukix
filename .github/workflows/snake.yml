name: Generate contribution snake

on:
  # Run every 12 hours to keep the snake fresh
  schedule:
    - cron: "0 */12 * * *"
  # Also run when this workflow file changes, so you can trigger by editing
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          # Your GitHub username — the snake eats YOUR contribution grid
          github_user_name: abukix
          # Where to write the generated SVGs
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # Push the generated SVGs to a dedicated branch — README references them from there
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
